# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'laktak/extrakto'

# 0 is too far from ` ;)
set -g base-index 1
setw -g pane-base-index 1

# set -g default-terminal screen-256color
set-option -g default-terminal "tmux-256color"
set-window-option -g xterm-keys on
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'
set -g status-keys vi
setw -g mode-keys vi
set -g history-limit 10000
set -g set-clipboard on
#
# Neovim likes this
set-option -g focus-events on

setw -g monitor-activity on
set -g mouse on

unbind c
bind-key c split-window -h -c "#{pane_current_path}"
bind-key C split-window -v -c "#{pane_current_path}"

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Pane Cycling
#unbind ^A
bind ^A select-pane -t :.+

# New window
bind-key Enter new-window -c "#{pane_current_path}"

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# No delay for escape key press
set-option -s escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# THEME (Flexoki, higher contrast)
set -as terminal-overrides ",*:Tc"
set-option -ga terminal-overrides ',*:enacs@:smacs@:rmacs@:acsc@'

# Status Bar
set -g status on
set-option -g status-interval 1
set-option -g status-position top
set-option -g status-justify centre
set-option -g status-left-length 40
set-option -g status-right-length 80

# Theme source: follow macOS appearance (same signal as nvim ThemeAuto)
if-shell '[ "$(defaults read -g AppleInterfaceStyle 2>/dev/null)" = "Dark" ]' \
  'set -g @flexoki_theme "dark"' \
  'set -g @flexoki_theme "light"'

# Theme refresh (prefix + T)
bind-key T run-shell 'tmux source-file ~/.tmux.conf; tmux display-message "tmux theme: $(tmux show -gqv @flexoki_theme)"'

# Window label spacing
setw -g window-status-separator ''
setw -g window-status-format ' #I:#W#{?window_flags,#{window_flags},} '
setw -g window-status-current-format ' #I:#W#{?window_flags,#{window_flags},} '

# Flexoki light/dark styles (contrast bumped for readability)
if-shell '[ "$(tmux show -gqv @flexoki_theme)" = "dark" ]' \
  'set -g status-style "fg=#FFFCF0,bg=#100F0F"; \
   set -g status-left "#[fg=#FFFCF0,bg=#D14D41,bold] #{?client_prefix,PREFIX,#S} #[fg=#100F0F,bg=#100F0F] "; \
   set -g status-right "#[fg=#100F0F,bg=#FFFCF0,bold] %d %b %H:%M "; \
   setw -g window-status-style "fg=#E6E4D9,bg=#100F0F"; \
   setw -g window-status-current-style "fg=#100F0F,bg=#FFFCF0,bold"; \
   setw -g window-status-activity-style "fg=#100F0F,bg=#D14D41,bold"; \
   set -g copy-mode-selection-style "fg=#100F0F,bg=#FFFCF0,bold"; \
   set -g copy-mode-mark-style "fg=#100F0F,bg=#D14D41,bold"; \
   set -g pane-border-style "fg=#575653"; \
   set -g pane-active-border-style "fg=#FFFCF0"; \
   set -g message-style "fg=#E6E4D9,bg=#282726"; \
   set -g message-command-style "fg=#100F0F,bg=#FFFCF0,bold"; \
   setw -g mode-style "fg=#100F0F,bg=#3AA99F,bold"' \
  'set -g status-style "fg=#403E3C,bg=#E6E4D9"; \
   set -g status-left "#[fg=#FFFCF0,bg=#AF3029,bold] #{?client_prefix,PREFIX,#S} #[fg=#E6E4D9,bg=#E6E4D9] "; \
   set -g status-right "#[fg=#FFFCF0,bg=#403E3C,bold] %d %b %H:%M "; \
   setw -g window-status-style "fg=#6F6E69,bg=#E6E4D9"; \
   setw -g window-status-current-style "fg=#FFFCF0,bg=#403E3C,bold"; \
   setw -g window-status-activity-style "fg=#FFFCF0,bg=#AF3029,bold"; \
   set -g copy-mode-selection-style "fg=#FFFCF0,bg=#100F0F,bold"; \
   set -g copy-mode-mark-style "fg=#FFFCF0,bg=#AF3029,bold"; \
   set -g pane-border-style "fg=#A7A59C"; \
   set -g pane-active-border-style "fg=#100F0F"; \
   set -g message-style "fg=#100F0F,bg=#E6E4D9"; \
   set -g message-command-style "fg=#FFFCF0,bg=#100F0F,bold"; \
   setw -g mode-style "fg=#FFFCF0,bg=#24837B,bold"'

# Copy mode + clipboard
if-shell -b 'command -v reattach-to-user-namespace >/dev/null' 'set-option -g default-command "reattach-to-user-namespace -l $SHELL"'
if-shell -b 'command -v reattach-to-user-namespace >/dev/null' 'set -g @copy_command "reattach-to-user-namespace pbcopy"'
if-shell -b 'test -z "#{@copy_command}" && command -v pbcopy >/dev/null' 'set -g @copy_command "pbcopy"'
if-shell -b 'test -z "#{@copy_command}" && command -v wl-copy >/dev/null' 'set -g @copy_command "wl-copy"'
if-shell -b 'test -z "#{@copy_command}" && command -v xclip >/dev/null' 'set -g @copy_command "xclip -selection clipboard"'
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}"

# TPM (optional)
if-shell -b '[ -x ~/.tmux/plugins/tpm/tpm ]' "run '~/.tmux/plugins/tpm/tpm'"
