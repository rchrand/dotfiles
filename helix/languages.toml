[language-server.pyright]
command = "pyright-langserver"
args = ["--stdio"]
config = { python = { analysis = { typeCheckingMode = "basic", autoSearchPaths = true, useLibraryCodeForTypes = true, autoImportCompletions = true, diagnosticMode = "workspace" } } }

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "python"
language-servers = ["pyright", "ruff"]
auto-format = true
roots = ["pyproject.toml", "ruff.toml", "ruff.ini", "pyrightconfig.json", "setup.cfg", ".git"]
indent = { tab-width = 4, unit = "    " }

[language.formatter]
command = "ruff"
args = ["format", "--stdin-filename", "%{buffer_name}", "--quiet", "-"]
